# Obrabi — full stack. First run:
#   ./scripts/gen-env.sh          # creates .env with random secrets
#   docker compose up -d --build
#   docker compose logs auth      # initial password of "nando"
#
# Optional HTTPS with automatic certificates (needs ports 80/443 reachable):
#   set OBRABI_DOMAIN in .env, then: docker compose --profile https up -d

name: obrabi

x-service: &service
  image: obrabi:${OBRABI_VERSION:-latest}
  build:
    context: .
    args:
      VERSION: ${OBRABI_VERSION:-dev}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [backend]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-env: &env
  OBRABI_ENV: production
  OBRABI_TIMEZONE: ${OBRABI_TIMEZONE:-Europe/Madrid}
  OBRABI_LOG_LEVEL: ${OBRABI_LOG_LEVEL:-info}
  OBRABI_INTERNAL_TOKEN: ${OBRABI_INTERNAL_TOKEN:?run ./scripts/gen-env.sh first}
  OBRABI_FEEDBACK_URL: http://feedback:8084

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obrabi
      POSTGRES_USER: obrabi_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/gen-env.sh first}
      # Read once by deploy/postgres/init when the data volume is created.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      PROJECTS_DB_PASSWORD: ${PROJECTS_DB_PASSWORD:?}
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD:?}
      FEEDBACK_DB_PASSWORD: ${FEEDBACK_DB_PASSWORD:?}
      TZ: ${OBRABI_TIMEZONE:-Europe/Madrid}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obrabi_admin -d obrabi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *logging

  auth:
    <<: *service
    command: ["/app/auth"]
    environment:
      <<: *env
      OBRABI_ADDR: ":8081"
      DATABASE_URL: postgres://obrabi_auth:${AUTH_DB_PASSWORD}@db:5432/obrabi?sslmode=disable
      OBRABI_BOOTSTRAP_USERS: ${OBRABI_BOOTSTRAP_USERS:-nando}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/auth", "healthcheck"]
    depends_on:
      db: { condition: service_healthy }

  projects:
    <<: *service
    command: ["/app/projects"]
    environment:
      <<: *env
      OBRABI_ADDR: ":8082"
      DATABASE_URL: postgres://obrabi_projects:${PROJECTS_DB_PASSWORD}@db:5432/obrabi?sslmode=disable
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/projects", "healthcheck"]
    depends_on:
      db: { condition: service_healthy }

  stats:
    <<: *service
    command: ["/app/stats"]
    environment:
      <<: *env
      OBRABI_ADDR: ":8083"
      DATABASE_URL: postgres://obrabi_stats:${STATS_DB_PASSWORD}@db:5432/obrabi?sslmode=disable
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/stats", "healthcheck"]
    depends_on:
      # stats reads the tables that the projects service migrates.
      projects: { condition: service_healthy }

  feedback:
    <<: *service
    command: ["/app/feedback"]
    environment:
      <<: *env
      OBRABI_ADDR: ":8084"
      DATABASE_URL: postgres://obrabi_feedback:${FEEDBACK_DB_PASSWORD}@db:5432/obrabi?sslmode=disable
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OBRABI_REPORT_EMAIL_TO: ${OBRABI_REPORT_EMAIL_TO:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/feedback", "healthcheck"]
    # The only service that talks to the Internet (SMTP).
    networks: [backend, egress]
    depends_on:
      db: { condition: service_healthy }

  gateway:
    <<: *service
    command: ["/app/gateway"]
    environment:
      <<: *env
      OBRABI_ADDR: ":8080"
      OBRABI_AUTH_URL: http://auth:8081
      OBRABI_PROJECTS_URL: http://projects:8082
      OBRABI_STATS_URL: http://stats:8083
      OBRABI_SESSION_SECRET: ${OBRABI_SESSION_SECRET:?run ./scripts/gen-env.sh first}
      OBRABI_SESSION_TTL: ${OBRABI_SESSION_TTL:-1440h}
      OBRABI_COOKIE_SECURE: ${OBRABI_COOKIE_SECURE:-auto}
      # The bundled Caddy lives in the edge subnet; add your own proxy in .env.
      OBRABI_TRUSTED_PROXIES: ${OBRABI_TRUSTED_PROXIES:-${OBRABI_EDGE_SUBNET:-172.30.80.0/24}}
    ports:
      - "${OBRABI_BIND:-0.0.0.0}:${OBRABI_PORT:-8080}:8080"
    networks: [backend, edge]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/gateway", "healthcheck"]
    depends_on:
      auth: { condition: service_healthy }
      projects: { condition: service_healthy }
      stats: { condition: service_healthy }
      feedback: { condition: service_healthy }

  # Nightly logical backup (pg_dump) into ./backups on the host, where
  # Proxmox Backup Server or any other tool can pick it up.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: obrabi_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: obrabi
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${OBRABI_TIMEZONE:-Europe/Madrid}
    volumes:
      - ./backups:/backups
      - ./deploy/backup/backup.sh:/backup.sh:ro
    networks: [backend]
    logging: *logging
    depends_on:
      db: { condition: service_healthy }

  # Optional: HTTPS with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      OBRABI_DOMAIN: ${OBRABI_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    logging: *logging
    depends_on:
      gateway: { condition: service_healthy }

networks:
  # Database and internal services: no route to the Internet.
  backend:
    internal: true
  # Published ports (gateway, Caddy).
  edge:
    ipam:
      config:
        - subnet: ${OBRABI_EDGE_SUBNET:-172.30.80.0/24}
  # Outbound e-mail from the feedback service.
  egress: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
